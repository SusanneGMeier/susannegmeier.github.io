<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --noir:#0A0A0A;
  --gold:#C9A24B;
  --creme:#ECE6DD;
  --muted:#8A8580;
  --line:#2A2A2A;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--noir);color:var(--creme);
  font-family:"Josefin Sans",system-ui,sans-serif;font-weight:300;
  line-height:1.7;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;
}
.g-text{background:linear-gradient(90deg,var(--gold) 0%,var(--creme) 50%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.signature{font-family:"Great Vibes",cursive;font-size:44px;margin-bottom:24px}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
h1{font-family:"Cinzel",Georgia,serif;font-weight:400;font-size:clamp(22px,4.5vw,32px);color:var(--gold);max-width:600px;margin-bottom:16px}
p.lead{max-width:440px;opacity:.85;margin-bottom:40px}
.rule{width:48px;height:1px;background:var(--gold);margin-bottom:40px}
footer{position:fixed;bottom:0;left:0;right:0;padding:24px;text-align:center}
footer a{color:var(--muted);text-decoration:none;font-size:12.5px;margin:0 12px}
footer a:hover{color:var(--gold)}
</style>
</head>
<body>

<p class="signature g-text">Susanne G. Meier</p>
<p class="eyebrow">Gastro-Business-Coach</p>
<div class="rule"></div>
